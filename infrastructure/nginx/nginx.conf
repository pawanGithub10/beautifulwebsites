# API Gateway / Reverse Proxy for Multi-Website Platform
# Routes requests to appropriate domain services

upstream site_service {
    server site-service:8010;
}

upstream storefront_service {
    server storefront-service:8011;
}

upstream booking_service {
    server booking-service:8012;
}

upstream lead_service {
    server lead-service:8013;
}

upstream content_service {
    server content-service:8014;
}

upstream widget_service {
    server widget-service:8015;
}

server {
    listen 80;
    server_name api.platform.local;

    # Increase timeouts for long-running requests
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Site Service
    location /api/sites {
        proxy_pass http://site_service;
    }

    # Storefront Service
    location /api/storefront {
        proxy_pass http://storefront_service;
    }

    location /api/catalog {
        proxy_pass http://storefront_service;
    }

    location /api/cart {
        proxy_pass http://storefront_service;
    }

    location /api/orders {
        proxy_pass http://storefront_service;
    }

    # Booking Service
    location /api/bookings {
        proxy_pass http://booking_service;
    }

    location /api/availability {
        proxy_pass http://booking_service;
    }

    location /api/providers {
        proxy_pass http://booking_service;
    }

    location /api/services {
        proxy_pass http://booking_service;
    }

    # Lead Service
    location /api/leads {
        proxy_pass http://lead_service;
    }

    location /api/lead-forms {
        proxy_pass http://lead_service;
    }

    # Content Service
    location /api/pages {
        proxy_pass http://content_service;
    }

    location /api/posts {
        proxy_pass http://content_service;
    }

    location /api/media {
        proxy_pass http://content_service;
    }

    # Widget Service
    location /api/widgets {
        proxy_pass http://widget_service;
    }

    # Health check aggregator
    location /health {
        return 200 '{"status":"healthy","gateway":"nginx"}';
        add_header Content-Type application/json;
    }
}

# Service-specific access (for development)
server {
    listen 8010;
    location / {
        proxy_pass http://site_service;
    }
}

server {
    listen 8011;
    location / {
        proxy_pass http://storefront_service;
    }
}

server {
    listen 8012;
    location / {
        proxy_pass http://booking_service;
    }
}

server {
    listen 8013;
    location / {
        proxy_pass http://lead_service;
    }
}

server {
    listen 8014;
    location / {
        proxy_pass http://content_service;
    }
}

server {
    listen 8015;
    location / {
        proxy_pass http://widget_service;
    }
}
